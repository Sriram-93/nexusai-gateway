version: '3.8'

services:
  # 1. PostgreSQL Database (Stores Bandits, Configs, Logs)
  postgres-nexus:
    image: postgres:15-alpine
    container_name: postgres-nexus
    environment:
      POSTGRES_DB: nexusai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis (Stores Rate Limits, Semantic Caches)
  redis-nexus:
    image: redis:7-alpine
    container_name: redis-nexus
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. NexusAI Spring Boot Gateway (Full-Stack with React)
  nexusai-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexusai-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-nexus:5432/nexusai_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_DATA_REDIS_HOST=redis-nexus
      - SPRING_DATA_REDIS_PORT=6379
      # Set API Keys via ENV in production
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY:-}
    depends_on:
      postgres-nexus:
        condition: service_healthy
      redis-nexus:
        condition: service_healthy

  # 4. Prometheus (Metrics Scraper)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-nexus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - nexusai-gateway

  # 5. Grafana (Observability Dashboard)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-nexus
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
