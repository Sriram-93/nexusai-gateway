# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nexusai}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgrespassword}

# Server Port (Required for Render)
server.port=${PORT:8080}

# JWT Security
jwt.secret=${JWT_SECRET:nexusai_super_secret_key_production_grade_32_chars}

# OpenAI API configuration
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4o-mini

# Anthropic Claude API configuration
claude.api.key=${CLAUDE_API_KEY:}
claude.api.url=https://api.anthropic.com/v1/messages
claude.model=claude-3-5-haiku-latest

# Ollama local configuration
ollama.api.url=http://localhost:11434/v1/chat/completions
ollama.model=llama3

# Toggle to automatically mock providers if their API keys are not set/paid
gateway.mock-missing-providers=false

# Redis Connection Configurations
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Rate Limiter Configuration Settings (Token Bucket only in production path)
# Sliding Window and Leaky Bucket are available in RateLimitExperimentService for benchmarking
gateway.rate-limiter.user.limit=200
gateway.rate-limiter.tenant.limit=500
gateway.rate-limiter.provider.gemini.limit=200
gateway.rate-limiter.provider.groq.limit=200
gateway.rate-limiter.provider.openai.limit=200
gateway.rate-limiter.provider.claude.limit=200
gateway.rate-limiter.provider.ollama.limit=500

# Spring Boot Actuator & Prometheus Observability Configuration
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.health.mail.enabled=false

# ============================================================
# AEDF — Adaptive Enterprise Decision Framework Configuration
# ============================================================

# Active routing strategy: STATIC | RULE_BASED | WEIGHTED | ADAPTIVE
# Change this single property to switch between experimental baselines
nexusai.routing.strategy=FEDERATED

# Static routing defaults (used when strategy=STATIC)
# (Keys completely removed to ensure zero hardcoded routing overrides)

# LinUCB exploration parameter (used when strategy=ADAPTIVE)
# Higher alpha = more exploration, lower alpha = more exploitation
nexusai.routing.linucb.alpha=1.0

# Enterprise Policy Filter
# IMPORTANT: Do NOT hardcode providers here. Approved providers are stored per-tenant
# in the database (tenant_configs table) and controlled via the dashboard.
# This global list is intentionally left empty.
nexusai.policy.approved-providers=
nexusai.policy.blocked-providers=

# ============================================================
# AEDF Reward Weights — Policy Tier Configuration (Q5 Fix)
# ============================================================
# Active policy tier: ENTERPRISE | BUDGET | MISSION_CRITICAL
# The RewardCalculator reads the weights for the active tier.
# Changing this single property reshapes what the bandit optimizes for.
nexusai.reward.active-tier=ENTERPRISE

# ENTERPRISE tier — optimize quality first, then reliability
# Use case: internal enterprise tools, knowledge-base Q&A
nexusai.reward.tier.enterprise.quality=0.60
nexusai.reward.tier.enterprise.availability=0.20
nexusai.reward.tier.enterprise.latency=0.10
nexusai.reward.tier.enterprise.cost=0.10

# BUDGET tier — optimize cost first, then latency
# Use case: high-volume, non-critical classification tasks
nexusai.reward.tier.budget.quality=0.15
nexusai.reward.tier.budget.availability=0.05
nexusai.reward.tier.budget.latency=0.30
nexusai.reward.tier.budget.cost=0.50

# MISSION_CRITICAL tier — optimize quality and reliability at any cost
# Use case: medical/finance/legal domain requests
nexusai.reward.tier.mission-critical.quality=0.70
nexusai.reward.tier.mission-critical.availability=0.20
nexusai.reward.tier.mission-critical.latency=0.05
nexusai.reward.tier.mission-critical.cost=0.05

# ============================================================
# EMAIL / SMTP CONFIGURATION
# Set MAIL_HOST, MAIL_PORT, MAIL_USER, MAIL_PASS in .env or
# the Render environment panel. Mail is optional — if not set,
# the system will log notifications instead of emailing them.
# ============================================================
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
nexusai.mail.from=${MAIL_FROM:noreply@nexusai.dev}
nexusai.app.url=${APP_URL:http://localhost:5173}

# Gateway abstraction & fallback switch
gateway.mock-missing-providers=false




