nexusai.models.groq-reasoning.output-price-per1m=0.99
nexusai.models.groq-reasoning.estimated-latency-ms=400
nexusai.models.groq-reasoning.context-window-tokens=131072
nexusai.models.groq-reasoning.enabled=true

nexusai.models.groq-llama.provider=groq
nexusai.models.groq-llama.model-id=openai/gpt-oss-120b
nexusai.models.groq-llama.input-price-per1m=0.15
nexusai.models.groq-llama.output-price-per1m=0.60
nexusai.models.groq-llama.estimated-latency-ms=300
nexusai.models.groq-llama.context-window-tokens=131072
nexusai.models.groq-llama.enabled=true

