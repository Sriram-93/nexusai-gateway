spring.application.name=nexusai-gateway
spring.config.import=optional:file:.env[.properties]
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions

gemini.api.key=${GEMINI_API_KEY:}
# NOTE: The model is NO LONGER embedded in the URL. The GeminiProvider reads the model dynamically
# from ModelRegistry. The URL below is the base template without a model suffix.
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1/chat/completions

claude.api.key=${CLAUDE_API_KEY:}
claude.api.url=https://api.anthropic.com/v1/messages

ollama.api.url=http://localhost:11434/v1/chat/completions

# ============================================================
# MODEL CATALOGUE — Single source of truth for all model arms.
# To add a new provider/model, add a new block here.
# No Java code changes are required.
# Format: nexusai.models.<logical-name>.<property>=<value>
# ============================================================

